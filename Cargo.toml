[package]
name = "tokn"
version = "0.2.0"
edition = "2021"
description = "Print GPT token counts for files/directories or stdin using gigatoken"

[dependencies]
gigatoken = { git = "https://github.com/marcelroed/gigatoken" }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
eyre = "0.6"
libc = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = true
opt-level = 3
