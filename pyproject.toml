[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokn"
version = "0.1.0"
description = "Print GPT token counts for files/directories or stdin using gigatoken"
requires-python = ">=3.10"
dependencies = [
    "gigatoken>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tokn = "tokn.cli:main"
